<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasifikasi Penyakit Bawang Merah dengan Pendekatan Deep Learning</title>
  <meta name="api-base" content="http://localhost:8000">

  <link rel="stylesheet" href="static/css/style.css">
  <link rel="stylesheet" href="static/css/pipeline.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z"/></svg>
      </div>
      <div>
        <div class="topbar-title">Klasifikasi Penyakit Bawang Merah</div>
        <div class="topbar-sub">dengan Pendekatan Deep Learning</div>
      </div>
    </div>
    <a href="deteksi.html" class="btn btn-secondary" style="text-decoration:none;">
      Mode Sederhana
    </a>
  </div>

  <div class="progress-wrap">
    <div class="progress-steps" id="steps">
      <div class="step active" onclick="goTo(0)">
        <div class="step-dot active" id="sd0">1</div>
        <div class="step-label">Input Gambar</div>
      </div>
      <div class="step-line" id="sl0"></div>
      <div class="step" onclick="goTo(1)">
        <div class="step-dot idle" id="sd1">2</div>
        <div class="step-label">Konvolusi</div>
      </div>
      <div class="step-line" id="sl1"></div>
      <div class="step" onclick="goTo(2)">
        <div class="step-dot idle" id="sd2">3</div>
        <div class="step-label">ReLU</div>
      </div>
      <div class="step-line" id="sl2"></div>
      <div class="step" onclick="goTo(3)">
        <div class="step-dot idle" id="sd3">4</div>
        <div class="step-label">Pooling</div>
      </div>
      <div class="step-line" id="sl3"></div>
      <div class="step" onclick="goTo(4)">
        <div class="step-dot idle" id="sd4">5</div>
        <div class="step-label">Global Average Pooling</div>
      </div>
      <div class="step-line" id="sl4"></div>
      <div class="step" onclick="goTo(5)">
        <div class="step-dot idle" id="sd5">6</div>
        <div class="step-label">Fully Connected</div>
      </div>
      <div class="step-line" id="sl5"></div>
      <div class="step" onclick="goTo(6)">
        <div class="step-dot idle" id="sd6">7</div>
        <div class="step-label">Hasil Deteksi</div>
      </div>
    </div>
  </div>

  <div id="app-content"></div>

  <!-- ============ MODAL KAMERA (akses webcam langsung, tidak lewat File Explorer) ============ -->
  <div id="cameraModal" class="camera-modal" style="display:none;">
    <div class="camera-modal-box">
      <div class="camera-modal-header">
        <span>Ambil Foto</span>
        <button class="camera-close-btn" onclick="closeCamera()" aria-label="Tutup kamera">&times;</button>
      </div>
      <div class="camera-video-wrap">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <canvas id="cameraCanvas" style="display:none;"></canvas>
        <div id="cameraError" class="camera-error" style="display:none;"></div>
      </div>
      <div class="camera-modal-actions">
        <button id="btnSwitchCamera" class="btn btn-secondary" style="display:none;" onclick="switchCamera()">
          <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          Ganti Kamera
        </button>
        <button id="btnCapture" class="btn btn-primary" onclick="capturePhoto()">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Jepret
        </button>
      </div>
    </div>
  </div>

  <script src="static/js/pipeline.js"></script>
  <script src="static/js/chart.js"></script>
  <script src="static/js/camera.js"></script>
  <script src="static/js/report-pdf.js"></script>
  <script src="static/js/main.js"></script>
</body>
</html>
