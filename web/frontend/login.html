<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | Klasifikasi Penyakit Bawang Merah</title>
  <meta name="api-base" content="http://localhost:5000">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="static/css/style.css">
  <link rel="stylesheet" href="static/css/admin.css">
  <style>
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-card { width: 100%; max-width: 380px; }
    .login-logo {
      width: 46px; height: 46px; border-radius: 12px; background: var(--amber-500);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
    }
    .login-logo svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2; }
    .login-title { text-align: center; font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .login-sub { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 4px; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border-strong);
      font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text-primary);
    }
    .field input:focus { outline: none; border-color: var(--purple-600); box-shadow: 0 0 0 3px var(--purple-100); }
    #loginBtn { width: 100%; justify-content: center; margin-top: 6px; }
    #loginError { display: none; }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="16" r="1.5"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
      <div class="login-title">Login Panel Admin</div>
      <div class="login-sub">Khusus admin/peneliti. Halaman ini tidak ditautkan dari situs petani.</div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <div class="notice warning" id="loginError">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <div class="notice-text" id="loginErrorMsg"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Masuk
        </button>
      </form>
    </div>
  </div>

  <script src="static/js/login.js"></script>
</body>
</html>
